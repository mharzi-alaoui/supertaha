<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SuperTaha, l'explorateur des oasis perdues</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F9E8F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#7FC8E8; --panel:#FFF6DF; --ink:#3B2A20; --muted:#7A5C45;
  --btn:#1F9E8F; --btn-ink:#FFFFFF; --btn2:#F2B441; --btn2-ink:#3B2A20;
  --pad:rgba(255,246,223,.55); --pad-ink:#3B2A20; --lock:#D8CBB2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241D45; --panel:#2C2550; --ink:#FFF4D6; --muted:#CFC3EE;
    --pad:rgba(44,37,80,.55); --pad-ink:#FFF4D6; --lock:#4A4275;
  }
}
:root[data-theme="dark"]{
  --bg:#241D45; --panel:#2C2550; --ink:#FFF4D6; --muted:#CFC3EE;
  --pad:rgba(44,37,80,.55); --pad-ink:#FFF4D6; --lock:#4A4275;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--btn2);outline-offset:3px}

.hudbtns{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:3}
.hudbtns button{width:46px;height:46px;border-radius:50%;border:0;background:var(--pad);color:var(--pad-ink);font-size:20px;line-height:1}

.pad{position:absolute;left:0;right:0;bottom:14px;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px;z-index:3;pointer-events:none}
@media (pointer:coarse){.pad{display:flex}}
body.touch .pad{display:flex}
.pad-l{display:flex;gap:14px}
.pad-r{display:flex;gap:14px;align-items:flex-end}
.pad button{pointer-events:auto;border:0;border-radius:50%;background:var(--pad);color:var(--pad-ink);
  width:76px;height:76px;font-size:30px;font-weight:800;touch-action:none}
.pad button.jump{width:96px;height:96px;font-size:22px}
.pad button.on{background:rgba(31,158,143,.75);color:#fff}

.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;
  background:rgba(40,25,15,.25)}
.ov.hide{display:none}
.card{background:var(--panel);color:var(--ink);border-radius:26px;padding:22px 22px 18px;max-width:440px;width:100%;
  max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(59,42,32,.18)}
.card h1{font-size:clamp(30px,8vw,42px);line-height:1;margin:4px 0 10px;font-weight:800;letter-spacing:-.01em}
.card h2{font-size:34px;line-height:1.05;margin:4px 0 6px;font-weight:800}
.card p{margin:0 auto 14px;font-size:18px;line-height:1.35;max-width:36ch}
.card .hint{font-size:15px;color:var(--muted);margin-top:12px;margin-bottom:0}
.levels{display:grid;gap:10px;margin:6px 0 0}
.big{display:block;width:100%;border:0;border-radius:999px;padding:12px 18px;font-size:21px;font-weight:700;
  background:var(--btn);color:var(--btn-ink)}
.big.alt{background:var(--btn2);color:var(--btn2-ink)}
.big:disabled{background:var(--lock);color:var(--muted);cursor:default}
.row{display:grid;gap:10px;margin-top:6px}
.score{font-size:22px;font-weight:700;margin:2px 0 14px}
.stars{font-size:38px;letter-spacing:4px;margin:2px 0 4px}
.card{touch-action:pan-y}
body.gp .card button:focus{outline:4px solid var(--btn2);outline-offset:3px}
.ed{text-align:left;margin-top:6px}
.ed .t{display:block;font-weight:700;font-size:17px;margin:12px 0 6px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(59,42,32,.25);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:0;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700;background:var(--lock);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.ed input[type=text]{width:100%;font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid var(--lock);
  background:transparent;color:var(--ink);user-select:text;-webkit-user-select:text}
#prev{display:block;margin:0 auto 4px;width:150px;height:170px;border-radius:20px;background:linear-gradient(#8FD3E8,#FFE3A3)}
.ed .file{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">

/* ---------- Niveaux ---------- */
function buildLevel(W, fn){
  const grid = Array.from({length:ROWS}, () => Array(W).fill(' '));
  const L = {W, grid, ents:[], start:2};
  const api = {
    ground(a,b){ for(let c=a;c<=b;c++){ grid[11][c]='#'; grid[12][c]='#'; } },
    block(x,y,w,h){ for(let r=y;r<y+h;r++) for(let c=x;c<x+w;c++) grid[r][c]='#'; },
    plat(x,y,n){ for(let c=x;c<x+n;c++) grid[y][c]='='; },
    dates(x,y,n){ for(let i=0;i<n;i++) L.ents.push({k:'date',c:x+i,r:y}); },
    star(x,y){ L.ents.push({k:'star',c:x,r:y}); },
    enemy(x,y=10){ L.ents.push({k:'enemy',c:x,r:y}); },
    spring(x){ L.ents.push({k:'spring',c:x,r:10}); },
    spike(x){ L.ents.push({k:'spike',c:x,r:10}); },
    check(x){ L.ents.push({k:'check',c:x,r:10}); },
    goal(x){ L.ents.push({k:'goal',c:x,r:10}); },
    start(x){ L.start = x; }
  };
  fn(api);
  return L;
}

let actx=null, muted=store.get('fennec-muted', false);
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume(); }
function beep(f, dur, type='square', vol=.06, slide=0, delay=0){
  if(muted || !actx) return;
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,f+slide), t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.02);
}

};

/* ---------- Grille ---------- */
function cell(c,r){ if(r<0||r>=ROWS||c<0||c>=W) return ' '; return grid[r][c]; }
function solidAt(c,r){ if(c<0) return true; return cell(c,r)==='#'; }
function oneWayAt(c,r){ return cell(c,r)==='='; }
function snapRow(c,r){ for(let rr=Math.max(0,r); rr<ROWS; rr++){ const v=cell(c,rr); if(v==='#'||v==='=') return rr; } return ROWS+3; }

function moveBody(b, dt){
  b.onGround=false; b.hitWall=false;
  b.x += b.vx*dt;
  let top=Math.floor(b.y/T), bot=Math.floor((b.y+b.h-1)/T);
  if(b.vx>0){ const c=Math.floor((b.x+b.w)/T);
    for(let r=top;r<=bot;r++) if(solidAt(c,r)){ b.x=c*T-b.w-.01; b.vx=0; b.hitWall=true; break; } }
  else if(b.vx<0){ const c=Math.floor(b.x/T);
    for(let r=top;r<=bot;r++) if(solidAt(c,r)){ b.x=(c+1)*T; b.vx=0; b.hitWall=true; break; } }
  const prevBottom = b.y+b.h;
  b.y += b.vy*dt;
  const left=Math.floor(b.x/T), right=Math.floor((b.x+b.w-1)/T);
  if(b.vy>0){ const r=Math.floor((b.y+b.h)/T);
    for(let c=left;c<=right;c++) if(solidAt(c,r) || (oneWayAt(c,r) && prevBottom<=r*T+.5)){ b.y=r*T-b.h; b.vy=0; b.onGround=true; break; } }
  else if(b.vy<0){ const r=Math.floor(b.y/T);
    for(let c=left;c<=right;c++) if(solidAt(c,r)){ b.y=(r+1)*T; b.vy=0; break; } }
}
const hit = (a,b,m=0) => a.x+m < b.x+b.w && a.x+a.w-m > b.x && a.y+m < b.y+b.h && a.y+a.h-m > b.y;

/* ---------- Chargement ---------- */
function loadLevel(i){
  levelIndex=i; const def=LEVELS[i]; const L=def.build();
  grid=L.grid; W=L.W; theme=THEMES[def.theme];
  items=[]; enemies=[]; springs=[]; spikes=[]; checks=[]; goal=null; particles=[]; fireballs=[];
  for(const e of L.ents){
    const by = snapRow(e.c, e.r)*T;
    switch(e.k){
      case 'date': items.push({k:'date', x:e.c*T+T/2, y:e.r*T+T/2, got:false, ph:Math.random()*6}); break;
      case 'star': items.push({k:'star', x:e.c*T+T/2, y:e.r*T+T/2, got:false, ph:Math.random()*6}); break;
      case 'enemy': enemies.push({x:e.c*T+4, y:by-24, w:32, h:24, vx:0, vy:0, dir:-1, alive:true, anim:Math.random()*6}); break;
      case 'spring': springs.push({x:e.c*T+4, y:by-18, w:32, h:18, t:0}); break;
      case 'spike': spikes.push({x:e.c*T+8, y:by-30, w:24, h:30}); break;
      case 'check': checks.push({x:e.c*T+8, y:by-72, w:28, h:72, on:false}); break;
      case 'goal': goal={x:e.c*T, y:by-120, w:70, h:120}; break;
    }
  }
  starTotal = items.filter(t=>t.k==='star').length; starsGot=0; datesGot=0; hearts=3;
  spawn = {x:L.start*T+7, y:snapRow(L.start,0)*T-34};
  P = {x:spawn.x, y:spawn.y, w:26, h:34, vx:0, vy:0, face:1, onGround:false, coy:0, buf:0, inv:0, run:0, land:0, throwT:0};
  camX = 0; winT = 0;
  toast(def.name, 2.4);
}

function toast(t, d=2){ toastText=t; toastT=d; }

/* ---------- Mise à jour ---------- */
function hurt(){
  if(P.inv>0) return;
  hearts--; P.inv=1.6; P.vy=-480; P.vx=-P.face*260; shake=.25; sfx.hurt();
  if(hearts<=0) respawn(true);
}
function respawn(lost){
  if(hearts<=0) hearts=3;
  P.x=spawn.x; P.y=spawn.y; P.vx=0; P.vy=0; P.inv=1.6;
  if(lost) toast("Oups ! "+heroName()+" repart du drapeau.", 2.2);
}
function burst(x,y,color,n=10,spd=220){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=spd*(.4+Math.random()*.6);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.6+Math.random()*.3,color,size:3+Math.random()*3}); }
}

function update(dt){
  time += dt;
  if(toastT>0) toastT-=dt;
  if(shake>0) shake-=dt;
  for(const s of springs) if(s.t>0) s.t-=dt;
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=900*dt; p.life-=dt; }
  particles = particles.filter(p=>p.life>0);

  if(state==='won'){ winT+=dt; P.vx*=.9; P.vy=Math.min(P.vy+G*dt,1000); moveBody(P,dt); updateCam(dt); return; }

  const dir = ((keys.right||padR)?1:0) - ((keys.left||padL)?1:0);
  const acc = P.onGround ? 2600 : 1700, target = dir*RUN;
  if(P.inv < 1.35){
    if(P.vx<target) P.vx=Math.min(target,P.vx+acc*dt); else if(P.vx>target) P.vx=Math.max(target,P.vx-acc*dt);
  }
  if(dir) P.face=dir;
  if(P.onGround) P.coy=.1; else P.coy-=dt;
  if(jumpPressed){ P.buf=.13; jumpPressed=false; } else P.buf-=dt;
  if(P.buf>0 && P.coy>0){ P.vy=-JUMP; P.buf=0; P.coy=0; sfx.jump(); }
  const g = (P.vy<0 && !(keys.jump||padJ)) ? G*2.4 : G;
  P.vy = Math.min(P.vy+g*dt, 1000);
  const wasGround=P.onGround, preVy=P.vy;
  moveBody(P,dt);
  if(P.onGround && !wasGround && preVy>350) P.land=.14;
  if(P.land>0) P.land-=dt;
  if(P.x > W*T-P.w) P.x = W*T-P.w;
  P.run += Math.abs(P.vx)*dt*.05;
  if(P.inv>0) P.inv-=dt;
  if(fireCd>0) fireCd-=dt;
  if(P.throwT>0) P.throwT-=dt;
  if(firePressed){ firePressed=false; throwFire(); }
  updateFire(dt);
  if(P.y > MAPH+60){ hearts--; sfx.hurt(); shake=.25; respawn(hearts<=0); if(hearts>0) toast("Attention au trou !",1.4); return; }

  for(const e of enemies){
    if(!e.alive) continue;
    if(Math.abs(e.x-P.x) > 1000) continue;
    e.anim += dt*10;
    e.vx = e.dir*60; e.vy = Math.min(e.vy+G*dt,1000);
    moveBody(e,dt);
    if(e.hitWall || e.x<=1) e.dir*=-1;
    else if(e.onGround){
      const ax = e.dir>0 ? e.x+e.w+1 : e.x-1, c=Math.floor(ax/T), r=Math.floor((e.y+e.h+2)/T);
      if(!(solidAt(c,r)||oneWayAt(c,r))) e.dir*=-1;
    }
    if(e.y>MAPH) e.alive=false;
    if(e.alive && hit(P,e,2)){
      if(P.vy>0 && P.y+P.h - e.y < 20){
        e.alive=false; P.vy = (keys.jump||padJ) ? -820 : -600;
        burst(e.x+16,e.y+12,'#7FB6D9',12); sfx.stomp();
      } else hurt();
    }
  }

  const pc = {x:P.x+P.w/2, y:P.y+P.h/2};
  for(const it of items){
    if(it.got) continue;
    const r = it.k==='star' ? 28 : 22;
    if(Math.abs(pc.x-it.x) < r && Math.abs(pc.y-it.y) < r+6){
      it.got=true;
      if(it.k==='star'){ starsGot++; burst(it.x,it.y,'#FFD23F',18,280); sfx.star(); toast("Une étoile !",1.1); }
      else { datesGot++; burst(it.x,it.y,'#C47A3D',6,150); sfx.date(); }
    }
  }
  for(const s of springs){
    if(s.t<=0 && P.vy>=0 && hit(P,s)){ P.y=s.y-P.h; P.vy=-SPRING; P.coy=0; s.t=.3; sfx.spring(); }
  }
  for(const s of spikes) if(hit(P,s,5)) hurt();
  for(const c of checks){
    if(!c.on && hit(P,c)){ c.on=true; spawn={x:c.x, y:c.y+c.h-34}; burst(c.x+14,c.y+10,'#1F9E8F',14); sfx.check(); toast("Drapeau atteint !",1.4); }
  }
  if(goal && hit(P,{x:goal.x+10,y:goal.y,w:goal.w-20,h:goal.h})){ win(); }
  updateCam(dt);
}
function updateCam(dt){
  const target = Math.max(0, Math.min(W*T-viewW, P.x - viewW*.38));
  camX += (target-camX)*Math.min(1, dt*8);
}

function throwFire(){
  if(fireCd>0 || fireballs.length>=3) return;
  fireCd=.28; P.throwT=.2;
  fireballs.push({x:P.x+P.w/2+P.face*18, y:P.y+10, vx:P.face*540, vy:-60, life:1.8});
  sfx.fire();
}
function updateFire(dt){
  for(const f of fireballs){
    f.life-=dt; f.vy=Math.min(f.vy+1500*dt,900);
    f.x+=f.vx*dt;
    if(solidAt(Math.floor((f.x+Math.sign(f.vx)*7)/T), Math.floor(f.y/T))){ f.life=0; burst(f.x,f.y,'#FF9A3C',6,120); continue; }
    const py=f.y; f.y+=f.vy*dt;
    if(f.vy>0){ const r=Math.floor((f.y+7)/T), c=Math.floor(f.x/T);
      if(solidAt(c,r) || (oneWayAt(c,r) && py+7<=r*T+1)){ f.y=r*T-7; f.vy=-430; } }
    if(f.y>MAPH+40 || f.x<camX-60 || f.x>camX+viewW+60) f.life=0;
    if(Math.random()<.5) particles.push({x:f.x,y:f.y,vx:-f.vx*.1+(Math.random()-.5)*40,vy:(Math.random()-.5)*40,life:.25,
      color:Math.random()<.5?'#FFB13B':'#FF6A1A',size:2+Math.random()*2.5});
    const box={x:f.x-8,y:f.y-8,w:16,h:16};
    for(const e of enemies){ if(e.alive && hit(box,e)){ e.alive=false; f.life=0; burst(e.x+16,e.y+12,'#FF9A3C',14); sfx.stomp(); break; } }
    if(f.life<=0) continue;
    for(let i=spikes.length-1;i>=0;i--){ const s=spikes[i];
      if(hit(box,s)){ spikes.splice(i,1); f.life=0; burst(s.x+12,s.y+15,theme.spike==='ice'?'#BFE9FA':'#4E9A51',16,240); sfx.stomp(); break; } }
  }
  fireballs=fireballs.filter(f=>f.life>0);
}
function win(){
  state='won'; sfx.win(); burst(goal.x+35,goal.y+40,'#FFD23F',30,320);
  if(levelIndex+1 >= unlocked) { unlocked = Math.min(LEVELS.length, levelIndex+2); store.set('fennec-unlocked', unlocked); }
  best[levelIndex] = Math.max(best[levelIndex]||0, starsGot); store.set('fennec-best', best);
  setTimeout(showWin, 900);
}

/* ---------- Dessin ---------- */
function ell(x,y,rx,ry,rot=0){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2); ctx.fill(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function tri(a,b,c,d,e,f){ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.lineTo(e,f); ctx.closePath(); ctx.fill(); }
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); ctx.fill(); }
function starShape(cx,cy,r1,r2,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?r2:r1, a=rot+i*Math.PI/5-Math.PI/2; ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); }
  ctx.closePath();
}
function hash(n){ const x=Math.sin(n*127.1)*43758.5453; return x-Math.floor(x); }

function hills(p,base,amp,f,color){
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,viewH);
  for(let x=0;x<=viewW+8;x+=8){ const wx=x+camX*p; ctx.lineTo(x, base+Math.sin(wx*f)*amp+Math.sin(wx*f*2.3+1)*amp*.4); }
  ctx.lineTo(viewW,viewH); ctx.closePath(); ctx.fill();
}
function palmTree(x,base,s,trunk,leaf){
  ctx.save(); ctx.translate(x,base); ctx.scale(s,s);
  ctx.fillStyle=trunk;
  for(let i=0;i<7;i++) ell(Math.sin(i*.35)*6, -i*14-6, 7-i*.3, 8);
  ctx.fillStyle=leaf;
  const tx=Math.sin(6*.35)*6, ty=-98;
  for(let i=0;i<6;i++){ const a=-Math.PI+i*Math.PI/5; ell(tx+Math.cos(a)*24, ty+Math.sin(a)*12+8, 28, 8, a+Math.PI/2*0+ (a+Math.PI/2)*.0); }
  ctx.restore();
}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,viewH);
  g.addColorStop(0,theme.sky[0]); g.addColorStop(1,theme.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,viewW,viewH);
  const gy = 11*T - camY;
  if(theme===THEMES.night){
    for(let i=0;i<70;i++){
      const x = ((hash(i)*viewW*1.5 - camX*.04) % viewW + viewW) % viewW, y = hash(i+99)*gy*.7;
      ctx.globalAlpha = .5+.5*Math.sin(time*2+i); ctx.fillStyle='#FFF6D8'; circ(x,y,1.2+hash(i+7)*1.4);
    }
    ctx.globalAlpha=1; ctx.fillStyle='#FFF6D8'; circ(viewW*.78, gy*.28, 26);
    ctx.fillStyle=theme.sky[0]; circ(viewW*.78+11, gy*.28-6, 22);
    const sp=230, off=camX*.15, k0=Math.floor(off/sp)-1, k1=k0+Math.ceil(viewW/sp)+3;
    for(let k=k0;k<=k1;k++){
      const px=k*sp-off, h=150+hash(k)*110, base=gy-20, w=170+hash(k+3)*60;
      ctx.fillStyle=theme.far; tri(px-w/2,base,px,base-h,px+w/2,base);
      ctx.fillStyle='#E9ECFF'; tri(px-w*.15,base-h*.7,px,base-h,px+w*.15,base-h*.7);
    }
    hills(.35, gy-40, 22, .008, theme.near);
  } else {
    ctx.fillStyle='rgba(255,247,200,.45)'; circ(viewW*.8, gy*.3, 54);
    ctx.fillStyle='#FFF2B0'; circ(viewW*.8, gy*.3, 34);
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<5;i++){
      const x = ((i*260 + time*8 - camX*.1) % (viewW+300) + viewW+300) % (viewW+300) - 150, y = 40+hash(i)*gy*.35;
      ell(x,y,40,14); ell(x+26,y-8,26,14); ell(x-24,y-4,22,11);
    }
    hills(.15, gy-110, 40, .004, theme.far);
    if(theme===THEMES.palm){
      const sp=280, off=camX*.35, k0=Math.floor(off/sp)-1, k1=k0+Math.ceil(viewW/sp)+3;
      for(let k=k0;k<=k1;k++) palmTree(k*sp-off+hash(k)*120, gy-40, .9+hash(k+5)*.4, '#6E8A4E', '#6F9A5A');
    }
    hills(.35, gy-50, 25, .008, theme.near);
  }
}

function drawTiles(){
  const c0=Math.max(0,Math.floor(camX/T)), c1=Math.min(W-1,Math.ceil((camX+viewW)/T));
  for(let c=c0;c<=c1;c++){
    for(let r=0;r<ROWS;r++){
      const v=grid[r][c], x=c*T, y=r*T;
      if(v==='#'){
        ctx.fillStyle=theme.ground; ctx.fillRect(x,y,T+.5,T+.5);
        ctx.fillStyle=theme.dot;
        if(hash(c*31+r)>.5) circ(x+10+hash(c+r)*18, y+14+hash(c*3+r)*16, 2.5);
        if(cell(c,r-1)!=='#'){ ctx.fillStyle=theme.top; rrect(x-1,y-2,T+2,11,5); }
      } else if(v==='='){
        ctx.fillStyle=theme.plank; rrect(x,y,T+.5,14,3);
        ctx.fillStyle=theme.plankTop; ctx.fillRect(x,y,T+.5,5);
      }
    }
    if(lift>0 && grid[12][c]==='#'){ ctx.fillStyle=theme.ground; ctx.fillRect(c*T, MAPH, T+.5, lift+2); }
  }
}

function drawFox(ph,onGround,moving){
  const bob=onGround&&moving?Math.abs(Math.sin(ph*6))*2:0; ctx.translate(0,-bob);
  ctx.fillStyle='#E9B872'; ell(-17,-15,12,6.5,-.5+Math.sin(ph*6)*.15);
  ctx.fillStyle='#5A3A26'; ell(-26,-20,4.5,3.5,-.5);
  const s = onGround ? Math.sin(ph*12)*5 : 3;
  ctx.fillStyle='#D9A15E'; rrect(-9+s,-9,6,10,3); rrect(4-s,-9,6,10,3);
  ctx.fillStyle='#F4D29C'; ell(0,-15,14,10);
  ctx.fillStyle='#FFF4E0'; ell(5,-12,8,6);
  ctx.fillStyle='#F4D29C'; tri(1,-33,-3,-57,9,-35); tri(8,-36,14,-59,18,-33);
  ctx.fillStyle='#F5A99B'; tri(2.5,-35,-.5,-51,7.5,-36); tri(10,-36,14,-53,16.5,-34);
  ctx.fillStyle='#F4D29C'; circ(9,-28,10.5);
  ctx.fillStyle='#FFF4E0'; ell(16,-25,6.5,4.5);
  ctx.fillStyle='#3B2A20'; circ(22,-26,2.3); circ(12,-30,2.5);
  ctx.fillStyle='#fff'; circ(12.9,-30.9,.9);
  ctx.fillStyle=AV.shirt; rrect(0,-22,13,6,3);
  tri(1,-21,-9,-16+Math.sin(time*10)*2,-1,-17);
}
function drawKid(ph,onGround,moving,face){
  ctx.scale(1.15,1.15);
  const bob=onGround&&moving?Math.abs(Math.sin(ph*6))*1.5:0; ctx.translate(0,-bob);
  const sw = onGround ? (moving?Math.sin(ph*12):0) : .6;
  const hx=2, hy=-40;
  if(AV.hairStyle==='long' && !avImg){ ctx.fillStyle=AV.hairColor; rrect(hx-14,hy-6,22,24,8); }
  ctx.fillStyle=AV.skin; rrect(-3-sw*6,-27,5,14,3);
  ctx.fillStyle=AV.pants; rrect(-7+sw*4,-13,6,12,2); rrect(1-sw*4,-13,6,12,2);
  ctx.fillStyle='#3B2A20'; ell(-3+sw*4,-1.5,5,2.6); ell(5-sw*4,-1.5,5,2.6);
  ctx.fillStyle=AV.shirt; rrect(-8,-28,16,17,6);
  ctx.fillStyle='rgba(255,255,255,.25)'; rrect(-8,-15,16,3,1);
  ctx.fillStyle=AV.skin; rrect(-1+sw*6,-27,5,14,3);
  if(avImg){
    ctx.save(); ctx.translate(hx,hy); ctx.scale(face,1);
    ctx.fillStyle='#fff'; circ(0,0,15.5);
    ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.clip();
    ctx.drawImage(avImg,-14,-14,28,28); ctx.restore(); return;
  }
  ctx.fillStyle=AV.skin; circ(hx,hy,13); circ(hx-12,hy+1,3.2);
  ctx.fillStyle=AV.hairColor;
  if(AV.hairStyle==='boucle'){
    for(let i=0;i<8;i++){ const a=Math.PI*1.05+i*Math.PI*1.0/7; circ(hx+Math.cos(a)*12,hy+Math.sin(a)*11-1,5.5); }
    circ(hx-12,hy-2,5);
  } else if(AV.hairStyle==='casquette'){
    ctx.beginPath(); ctx.arc(hx,hy-1,13.5,Math.PI,0); ctx.fill();
    ctx.fillStyle='#E04B5A'; ctx.beginPath(); ctx.arc(hx,hy-3,13.5,Math.PI*1.02,-.02); ctx.fill();
    rrect(hx+4,hy-6,15,4,2); ctx.fillStyle='#fff'; circ(hx-1,hy-14,2);
  } else {
    ctx.beginPath(); ctx.arc(hx,hy-1,13.5,Math.PI*1.02,-.1); ctx.lineTo(hx+6,hy-5); ctx.lineTo(hx-13,hy-1); ctx.fill();
    ellFringe(hx,hy);
  }
  ctx.fillStyle='#3B2A20'; circ(hx+7,hy-1,2.2); ctx.fillStyle='#fff'; circ(hx+7.7,hy-1.8,.8);
  ctx.fillStyle='rgba(240,106,138,.45)'; circ(hx+5,hy+5,2.8);
  ctx.strokeStyle='#3B2A20'; ctx.lineWidth=1.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(hx+8,hy+4,3.2,.3,1.6); ctx.stroke();
}
function ellFringe(hx,hy){ ell(hx+5,hy-9,8,4.5,.3); }
function drawCustom(ph,onGround,moving,pose){
  if(!pose){
    if(!onGround) pose='jump';
    else if(moving) pose = Math.floor(ph/1.6)%2 ? 'run' : 'walk';
    else pose='stand';
  }
  const ps=POSES[pose], h=ps.h, w=h*ps.r;
  if(onGround){ ctx.fillStyle='rgba(59,42,32,.18)'; ell(0,0,16,3.5); }
  let sy=1; if(pose==='stand') sy=1+Math.sin(time*3)*.012;
  ctx.scale(1,sy);
  if(ps.img.complete) ctx.drawImage(ps.img,-w/2,-h,w,h);
}
function heroPose(){
  if(!P || state==='menu' || state==='pause' && false) return null;
  if(ctx!==mainCtx) return null;
  if(state==='won') return 'victory';
  if(P.inv>1.25) return 'duck';
  if(P.throwT>0) return 'run';
  if(P.onGround && P.land>0) return 'crouch';
  return null;
}
function drawAvatar(face,ph,onGround,moving){
  if(AV.type==='custom') drawCustom(ph,onGround,moving,heroPose());
  else if(AV.type==='fox') drawFox(ph,onGround,moving); else drawKid(ph,onGround,moving,face);
}
function drawHero(){
  if(P.inv>0 && Math.floor(P.inv*14)%2===0) return;
  ctx.save(); ctx.translate(P.x+13, P.y+34); ctx.scale(P.face,1);
  drawAvatar(P.face,P.run,P.onGround,Math.abs(P.vx)>20);
  ctx.restore();
}
function drawScarab(e){
  ctx.save(); ctx.translate(e.x+16,e.y+24); ctx.scale(e.dir>0?1:-1,1);
  ctx.strokeStyle='#1C2E44'; ctx.lineWidth=2.5; ctx.lineCap='round';
  for(let i=-1;i<=1;i++){ const w=Math.sin(e.anim+i)*3; ctx.beginPath(); ctx.moveTo(i*8,-6); ctx.lineTo(i*8+w,0); ctx.stroke(); }
  ctx.fillStyle='#2E5A7A'; ell(0,-11,15,10);
  ctx.strokeStyle='#1C3A52'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-1,-20); ctx.lineTo(-1,-3); ctx.stroke();
  ctx.fillStyle='#7FB6D9'; ell(-5,-15,4,2.5);
  ctx.fillStyle='#1C2E44'; circ(14,-9,5.5);
  ctx.fillStyle='#fff'; circ(16,-10,2); ctx.fillStyle='#1C2E44'; circ(16.6,-10,1);
  ctx.restore();
}
function drawItems(){
  for(const it of items){
    if(it.got) continue;
    const bob=Math.sin(time*3+it.ph)*3;
    if(it.k==='date'){
      ctx.fillStyle='#8B4A2B'; ell(it.x,it.y+bob,7,10,.4);
      ctx.fillStyle='#C47A3D'; ell(it.x-2,it.y-3+bob,2.5,4,.4);
    } else {
      ctx.fillStyle='rgba(255,226,120,.35)'; circ(it.x,it.y+bob,22);
      starShape(it.x,it.y+bob,16,7,Math.sin(time*2+it.ph)*.25);
      ctx.fillStyle='#FFD23F'; ctx.fill(); ctx.strokeStyle='#E0A100'; ctx.lineWidth=2.5; ctx.stroke();
    }
  }
}
function drawProps(){
  for(const s of springs){
    const k = s.t>0 ? .5 : 1;
    ctx.fillStyle='#6B6B7A'; rrect(s.x,s.y+s.h-5,s.w,5,2);
    ctx.strokeStyle='#9A9AAE'; ctx.lineWidth=3; ctx.beginPath();
    const top=s.y+s.h-5-(s.h-6)*k;
    for(let i=0;i<=4;i++){ const y=s.y+s.h-5-(s.h-6)*k*i/4; ctx.lineTo(s.x+(i%2?6:s.w-6), y); }
    ctx.stroke();
    ctx.fillStyle='#E04B5A'; rrect(s.x-2,top-6,s.w+4,7,3);
  }
  for(const s of spikes){
    if(theme.spike==='ice'){
      ctx.fillStyle='#9FD8F0'; tri(s.x,s.y+s.h,s.x+8,s.y,s.x+14,s.y+s.h); tri(s.x+10,s.y+s.h,s.x+17,s.y+6,s.x+24,s.y+s.h);
      ctx.fillStyle='#E6F7FF'; tri(s.x+5,s.y+s.h,s.x+8,s.y+6,s.x+9,s.y+s.h);
    } else {
      ctx.fillStyle='#4E9A51'; rrect(s.x+7,s.y,11,s.h,6); rrect(s.x,s.y+8,6,12,3); rrect(s.x+19,s.y+5,6,11,3);
      rrect(s.x,s.y+16,10,5,2); rrect(s.x+16,s.y+13,9,5,2);
      ctx.fillStyle='#FFE8A0'; for(let i=0;i<4;i++){ circ(s.x+10,s.y+5+i*7,1.2); circ(s.x+15,s.y+8+i*7,1.2); }
      ctx.fillStyle='#F06A8A'; circ(s.x+12.5,s.y-1,3);
    }
  }
  for(const c of checks){
    ctx.fillStyle='#7A5C45'; rrect(c.x+4,c.y,5,c.h,2);
    ctx.fillStyle='#7A5C45'; circ(c.x+6.5,c.y,4);
    const w=Math.sin(time*6)*3;
    ctx.fillStyle = c.on ? '#1F9E8F' : '#E8E0D0';
    ctx.beginPath(); ctx.moveTo(c.x+9,c.y+4); ctx.quadraticCurveTo(c.x+24,c.y+8+w,c.x+38,c.y+14);
    ctx.quadraticCurveTo(c.x+24,c.y+20+w,c.x+9,c.y+26); ctx.closePath(); ctx.fill();
    if(c.on){ starShape(c.x+20,c.y+15,5,2.2,0); ctx.fillStyle='#FFD23F'; ctx.fill(); }
  }
  if(goal){
    const gx=goal.x, by=goal.y+goal.h;
    ctx.fillStyle='rgba(120,220,240,.35)'; ell(gx+35,by-4,52,12);
    ctx.fillStyle='#4CC3D9'; ell(gx+35,by-4,44,8);
    ctx.fillStyle='#BFF1FA'; ell(gx+25+Math.sin(time*2)*6,by-6,10,2);
    palmTree(gx+12,by-4,1,'#A0703F','#3F9E58');
    palmTree(gx+60,by-4,.8,'#A0703F','#57B56C');
    ctx.fillStyle='#FFD23F'; ctx.globalAlpha=.6+.4*Math.sin(time*4);
    starShape(gx+40,goal.y+8,9,4,time); ctx.fill(); ctx.globalAlpha=1;
  }
}
function drawFireballs(){
  for(const f of fireballs){
    const fl=Math.sin(time*40+f.x)*1.5;
    ctx.fillStyle='rgba(255,150,40,.35)'; circ(f.x,f.y,13+fl);
    ctx.fillStyle='#FF6A1A'; circ(f.x,f.y,8);
    ctx.fillStyle='#FFD447'; circ(f.x+Math.sign(f.vx)*1.5,f.y-1,4);
  }
}
function drawParticles(){
  for(const p of particles){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2)); ctx.fillStyle=p.color; circ(p.x,p.y,p.size); }
  ctx.globalAlpha=1;
}
function heart(x,y,s,full){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.beginPath(); ctx.moveTo(0,4);
  ctx.bezierCurveTo(0,-2,-9,-2,-9,4); ctx.bezierCurveTo(-9,9,-2,12,0,15);
  ctx.bezierCurveTo(2,12,9,9,9,4); ctx.bezierCurveTo(9,-2,0,-2,0,4);
  ctx.fillStyle = full ? '#E04B5A' : 'rgba(255,255,255,.45)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(59,42,32,.6)'; ctx.stroke(); ctx.restore();
}
function hudText(t,x,y,size=24,align='left'){
  ctx.font=`800 ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineWidth=5; ctx.strokeStyle='rgba(59,42,32,.75)'; ctx.lineJoin='round'; ctx.strokeText(t,x,y);
  ctx.fillStyle='#fff'; ctx.fillText(t,x,y);
}
function drawHud(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(let i=0;i<3;i++) heart(28+i*30,18,1.25,i<hearts);
  ctx.fillStyle='#8B4A2B'; ell(30,62,7,10,.4); hudText('× '+datesGot,44,63);
  starShape(30,96,13,6,0); ctx.fillStyle='#FFD23F'; ctx.fill(); ctx.strokeStyle='#E0A100'; ctx.lineWidth=2; ctx.stroke();
  hudText(starsGot+' / '+starTotal,48,97);
  if(toastT>0 && state!=='menu'){
    ctx.globalAlpha=Math.min(1,toastT*3);
    hudText(toastText, cw/2, Math.max(70, ch*.2), Math.min(34, cw/14), 'center');
    ctx.globalAlpha=1;
  }
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cw,ch);
  if(!grid) return;
  const k=sc*dpr;
  let sx=0, sy=0; if(shake>0){ sx=(Math.random()-.5)*8; sy=(Math.random()-.5)*8; }
  ctx.setTransform(k,0,0,k,sx*dpr,sy*dpr);
  drawBg();
  ctx.save(); ctx.translate(-Math.round(camX*k)/k, -camY);
  drawTiles(); drawProps(); drawItems();
  for(const e of enemies) if(e.alive) drawScarab(e);
  drawFireballs(); drawHero(); drawParticles();
  ctx.restore();
  if(state!=='menu') drawHud();
}

/* ---------- Boucle ---------- */
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  pollPad();
  if(state==='play' || state==='won'){ acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; } }
  else { time+=dt; }
  render(); requestAnimationFrame(frame);
}

function resize(){
  const r=cv.getBoundingClientRect(); cw=r.width; ch=r.height;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  sc=Math.min(ch/MAPH, cw/(15*T)); viewW=cw/sc; viewH=ch/sc;
  const touch = document.body.classList.contains('touch') || matchMedia('(pointer:coarse)').matches;
  const spare=Math.max(0,viewH-MAPH);
  lift=Math.min(spare, (touch?125:0)/sc);
  camY = MAPH - viewH + lift;
}
window.addEventListener('resize', resize);

/* ---------- Écrans ---------- */
const ov=document.getElementById('ov'), card=document.getElementById('card');
function showOverlay(html){ card.innerHTML=html; ov.classList.remove('hide'); const b=card.querySelector('button:not(:disabled)'); if(b) b.focus({preventScroll:true}); }
function hideOverlay(){ ov.classList.add('hide'); }
function starsLine(n,t){ let s=''; for(let i=0;i<t;i++) s+= i<n ? '★' : '☆'; return s; }

function showMenu(){
  state='menu';
  if(!grid) loadLevel(0);
  const btns = LEVELS.map((l,i)=>{
    const open=i<unlocked, b=best[i]||0;
    return `<button class="big${i===0?'':' alt'}" data-lvl="${i}" ${open?'':'disabled'}>${open?'':'🔒 '}${i+1}. ${l.name}${open&&b?' '+'★'.repeat(b):''}</button>`;
  }).join('');
  const nm=esc(heroName());
  showOverlay(`<h1>SuperTaha, l'explorateur des oasis perdues</h1>
    <p>Aide ${nm} à traverser les dunes, la palmeraie et l'Atlas pour retrouver l'oasis. Ramasse les dattes, attrape les étoiles et saute sur les scarabées.</p>
    <div class="levels">${btns}<button class="big alt" id="bAv">🎨 Mon avatar</button></div>
    <p class="hint">Clavier : flèches ou Q / D pour courir, Espace pour sauter, F pour lancer du feu.<br>Manette : stick ou croix pour courir, A pour sauter, X pour lancer du feu, Start pour la pause.</p>`);
  card.querySelectorAll('[data-lvl]').forEach(b=>b.addEventListener('click',()=>startLevel(+b.dataset.lvl)));
  document.getElementById('bAv').onclick=showEditor;
}
function showEditor(){
  state='menu';
  const sw=(key,list)=>`<div class="sw">${list.map(c=>`<button data-k="${key}" data-v="${c}" style="background:${c}" aria-label="Couleur ${c}" aria-pressed="${AV[key]===c}"></button>`).join('')}</div>`;
  const chips=(key,opts)=>`<div class="chips">${opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" aria-pressed="${AV[key]===v}">${l}</button>`).join('')}</div>`;
  const kid=AV.type==='kid';
  showOverlay(`<h2>Mon avatar</h2>
    <canvas id="prev" width="300" height="340"></canvas>
    <div class="ed">
      <label class="t" for="nm">Prénom</label>
      <input type="text" id="nm" maxlength="14" placeholder="Ton prénom" value="${esc(AV.name||'')}">
      <span class="t">Personnage</span>${chips('type',[['custom','Mon avatar'],['kid','Enfant'],['fox','Fennec']])}
      ${kid?`<span class="t">Visage</span>
      <div class="chips"><button id="bPh">📷 ${AV.photo?'Changer la photo':'Ajouter une photo'}</button>${AV.photo?'<button id="bNoPh">Enlever la photo</button>':''}</div>
      <input class="file" type="file" id="fPh" accept="image/*">
      ${AV.photo?'':`<span class="t">Peau</span>${sw('skin',SKINS)}
      <span class="t">Coiffure</span>${chips('hairStyle',[['court','Courte'],['boucle','Bouclée'],['long','Longue'],['casquette','Casquette']])}
      <span class="t">Couleur des cheveux</span>${sw('hairColor',HAIRC)}`}
      <span class="t">Pantalon</span>${sw('pants',CLOTH)}`:''}
      ${AV.type==='custom'?'':`<span class="t">${kid?'T-shirt':'Écharpe'}</span>${sw('shirt',CLOTH)}`}
    </div>
    <div class="row" style="margin-top:16px"><button class="big" id="bOk">C'est parti !</button></div>`);
  const save=()=>{ try{ store.set('fennec-avatar',AV); }catch(e){} };
  card.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    AV[b.dataset.k]=b.dataset.v; save();
    const sc=card.scrollTop; showEditor(); card.scrollTop=sc;
  });
  document.getElementById('nm').oninput=e=>{ AV.name=e.target.value; save(); };
  const f=document.getElementById('fPh');
  if(f){
    document.getElementById('bPh').onclick=()=>f.click();
    f.onchange=()=>{
      const file=f.files&&f.files[0]; if(!file) return;
      const rd=new FileReader();
      rd.onload=()=>{ const im=new Image(); im.onload=()=>{
        const c=document.createElement('canvas'); c.width=c.height=128;
        const m=Math.min(im.width,im.height), x=(im.width-m)/2, y=(im.height-m)/2.4;
        c.getContext('2d').drawImage(im,x,Math.max(0,y),m,m,0,0,128,128);
        AV.photo=c.toDataURL('image/jpeg',.85); save(); loadAvImg();
        setTimeout(showEditor,60);
      }; im.src=rd.result; };
      rd.readAsDataURL(file);
    };
    const np=document.getElementById('bNoPh'); if(np) np.onclick=()=>{ AV.photo=''; save(); loadAvImg(); showEditor(); };
  }
  document.getElementById('bOk').onclick=showMenu;
  if(!prevLoop){ prevLoop=true; drawPreview(); }
}
let prevLoop=false;
function drawPreview(){
  const pc=document.getElementById('prev'); if(!pc || ov.classList.contains('hide')){ prevLoop=false; return; }
  const c2=pc.getContext('2d'), old=ctx;
  c2.setTransform(1,0,0,1,0,0); c2.clearRect(0,0,pc.width,pc.height);
  c2.fillStyle='#F0BE63'; c2.fillRect(0,280,300,60); c2.fillStyle='#FFE1A1'; c2.fillRect(0,276,300,10);
  c2.setTransform(3.6,0,0,3.6,150,282);
  ctx=c2; try{ drawAvatar(1,time*.6,true,true); } finally { ctx=old; }
  requestAnimationFrame(drawPreview);
}
function startLevel(i){ audio(); loadLevel(i); hideOverlay(); state='play'; resize(); }
function showWin(){
  const lastLvl = levelIndex===LEVELS.length-1;
  if(lastLvl){
    showOverlay(`<h2>${esc(heroName())} a retrouvé l'oasis !</h2>
      <div class="stars">${starsLine(starsGot,starTotal)}</div>
      <p class="score">${datesGot} dattes ramassées</p>
      <p>Bravo, tu as terminé l'aventure. Peux-tu attraper toutes les étoiles de chaque niveau ?</p>
      <div class="row"><button class="big" id="bAgain">Rejouer ce niveau</button><button class="big alt" id="bMenu">Choisir un niveau</button></div>`);
  } else {
    showOverlay(`<h2>Bravo !</h2>
      <div class="stars">${starsLine(starsGot,starTotal)}</div>
      <p class="score">${datesGot} dattes ramassées</p>
      <div class="row"><button class="big" id="bNext">Niveau suivant</button><button class="big alt" id="bAgain">Rejouer ce niveau</button></div>`);
    document.getElementById('bNext').onclick=()=>startLevel(levelIndex+1);
  }
  document.getElementById('bAgain').onclick=()=>startLevel(levelIndex);
  const m=document.getElementById('bMenu'); if(m) m.onclick=showMenu;
}
function pause(){
  if(state!=='play') return;
  state='pause'; releaseAll();
  showOverlay(`<h2>Pause</h2><div class="row"><button class="big" id="bGo">Continuer</button><button class="big alt" id="bRe">Recommencer le niveau</button><button class="big alt" id="bMenu">Choisir un niveau</button></div>`);
  document.getElementById('bGo').onclick=resume;
  document.getElementById('bRe').onclick=()=>startLevel(levelIndex);
  document.getElementById('bMenu').onclick=showMenu;
}
function resume(){ hideOverlay(); state='play'; last=performance.now(); }
document.getElementById('bPause').onclick=()=>{ state==='pause'?resume():pause(); };
const bMute=document.getElementById('bMute');
function setMuteIcon(){ bMute.textContent = muted?'🔇':'🔊'; bMute.setAttribute('aria-label', muted?'Remettre le son':'Couper le son'); }
bMute.onclick=()=>{ audio(); muted=!muted; store.set('fennec-muted',muted); setMuteIcon(); };
setMuteIcon();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });

/* ---------- Contrôles ---------- */
function releaseAll(){ keys.left=keys.right=keys.jump=keys.fire=false; document.querySelectorAll('.pad button').forEach(b=>b.classList.remove('on')); }
const KEYMAP = {ArrowLeft:'left',KeyA:'left',KeyQ:'left',ArrowRight:'right',KeyD:'right',
                Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',
                KeyF:'fire',KeyX:'fire',KeyE:'fire',ShiftLeft:'fire',ShiftRight:'fire'};
window.addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP'){ if(state==='play') pause(); else if(state==='pause') resume(); return; }
  const k=KEYMAP[e.code]; if(!k || state!=='play') return;
  e.preventDefault(); audio();
  if(k==='jump' && !keys.jump) jumpPressed=true;
  if(k==='fire' && !keys.fire) firePressed=true;
  keys[k]=true;
});
window.addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=false; });
function bindPad(id,k){
  const b=document.getElementById(id);
  const down=e=>{ e.preventDefault(); audio(); document.body.classList.add('touch');
    if(k==='jump' && !keys.jump) jumpPressed=true;
    if(k==='fire' && !keys.fire) firePressed=true;
    keys[k]=true; b.classList.add('on');
    try{ b.setPointerCapture(e.pointerId); }catch(_){} };
  const up=e=>{ keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindPad('bL','left'); bindPad('bR','right'); bindPad('bJ','jump'); bindPad('bF','fire');
window.addEventListener('touchstart',()=>{ if(!document.body.classList.contains('touch')){ document.body.classList.add('touch'); resize(); } },{passive:true});
window.addEventListener('blur',releaseAll);

/* ---------- Manette ---------- */
let padL=false, padR=false, padJ=false;
const gpPrev={};
function pollPad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp=null; for(const p of pads){ if(p && p.connected){ gp=p; break; } }
  if(!gp){ padL=padR=padJ=false; return; }
  const btn=i=>!!(gp.buttons[i] && gp.buttons[i].pressed);
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0;
  const now={L:btn(14)||ax<-.4, R:btn(15)||ax>.4, U:btn(12)||ay<-.5, D:btn(13)||ay>.5,
             A:btn(0)||btn(1), S:btn(9), X:btn(2)||btn(3)||btn(5)||btn(7)};
  const e={}; for(const k in now){ e[k]=now[k]&&!gpPrev[k]; gpPrev[k]=now[k]; }
  if(Object.values(e).some(Boolean)) audio();
  if(state==='play'){
    padL=now.L; padR=now.R; padJ=now.A;
    if(e.A) jumpPressed=true;
    if(e.X) firePressed=true;
    if(e.S) pause();
    return;
  }
  padL=padR=padJ=false;
  if(ov.classList.contains('hide')) return;
  const bs=[...card.querySelectorAll('button:not(:disabled)')].filter(b=>b.offsetParent!==null);
  if(!bs.length) return;
  let i=bs.indexOf(document.activeElement);
  if(e.D||e.R||e.U||e.L) document.body.classList.add('gp');
  if(e.D||e.R){ bs[i<0?0:Math.min(bs.length-1,i+1)].focus(); }
  if(e.U||e.L){ bs[i<0?0:Math.max(0,i-1)].focus(); }
  if(e.A){ (i>=0 ? bs[i] : bs[0]).click(); }
  if(e.S && state==='pause') resume();
}
window.addEventListener('gamepadconnected',()=>{ audio(); toast('Manette connectée !',1.6); });
window.addEventListener('mousemove',()=>document.body.classList.remove('gp'));

/* ---------- Démarrage ---------- */
resize();
loadLevel(0);
showMenu();
requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
